

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Login System</title>

  <link rel="stylesheet" href="CSS/bootstrap.min.css">
  <link rel="stylesheet" href="CSS/all.min.css">
  <link rel="stylesheet" href="CSS/style.css">

  
</head>
<body class="body">

  <div class="all container my-5 mb-5">
    <div class="text-center m-auto w-75 p-5">
      
      <div class="heading fw-bold display-3 my-3">
        <h1>Smart Login System</h1>
      </div>

      <div class="input-div mb-3">
        <input type="email" class="   form-control my-3" placeholder="Enter your email" id="signinEmail">
     

      
        <input type="password" class="  form-control my-3" placeholder="Enter your password" id="signinPassword">
       </div>

      <div class="d-grid gap-2">
        <button id="signinBtn" type="button" class="btn btn-outline-info my-3">Login</button>
        <p id="formMsg" class="d-none mt-2"></p>

      </div>

      <p class="fw-semibold text-note">
        Don’t have an account? <a href="register.html">Sign Up</a>
      </p>
    </div>
  </div>

  <script src="JS/bootstrap.bundle.min.js"></script>
  <script src="JS/main.js"></script>
</body>
</html>
