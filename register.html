<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Smart Login System</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Smart Login System" />
  <meta property="og:description" content="Login and signup demo with client-side validation, hashed passwords and a profile page, stored in your browser with localStorage." />
  <meta property="og:url" content="https://malakmo7amed309.github.io/smart-login/" />
  <meta property="og:image" content="https://malakmo7amed309.github.io/smart-login/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="CSS/bootstrap.min.css">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
<main class="shell">
  <aside class="side"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M12 2l8 3v6c0 5-3.400 9-8 11-4.600-2-8-6-8-11V5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8.500 12l2.500 2.500 4.500-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1>Smart Login</h1><p>Sign up, sign in and manage your profile. Everything stays in this browser.</p>
    <p class="demo">Learning demo. Passwords are hashed in your browser, but real apps need a server.</p></aside>
  <section class="panel">
    <h2>Create your account</h2>
    <form id="signupForm" novalidate>
        <label class="lbl" for="signupName">Name</label>
        <input type="text" class="form-control" id="signupName" autocomplete="name" placeholder="Your name">
        <label class="lbl" for="signupEmail">Email</label>
        <input type="email" class="form-control" id="signupEmail" autocomplete="email" placeholder="you@example.com">
        <label class="lbl" for="signupPassword">Password</label>
        <div class="pw"><input type="password" class="form-control" id="signupPassword" autocomplete="new-password" placeholder="At least 6 characters">
        <button type="button" class="eye" data-eye="signupPassword" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div>
        <div class="meter" aria-hidden="true"><span id="meterBar"></span></div>
        <p id="meterTxt" class="hint">Use 6+ characters. Mix letters, numbers and symbols.</p>
        <p id="formMsg" class="msg d-none" role="alert"></p>
        <button id="signupBtn" type="submit" class="btn-main">Sign Up</button>
    </form>
    <p class="alt">Already registered? <a href="index.html">Sign in</a></p>
  </section>
</main>
<script src="JS/main.js"></script>
</body>
</html>
