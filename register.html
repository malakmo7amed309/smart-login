<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Login System</title>
    
    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body class="body">

         <div class="all container my-5  mb-5">
    <div class="text-center m-auto w-75 p-5">
      
      <div class="heading fw-bold display-3 my-3">
        <h1>Smart Login System</h1>
      </div>

     <div class="input-div mb-3">
        <input type="text" class=" form-control my-3" placeholder="Enter your name" id="signupName">
     


      <div class="input-div mb-3">
        <input type="email" class=" form-control my-3" placeholder="Enter your email" id="signupEmail">
     

      
        <input type="password" class=" form-control my-3" placeholder="Enter your password" id="signupPassword">
       </div>

      <div class="d-grid gap-2">
<button id="signupBtn" type="button" class="btn btn-outline-info my-3">Sign Up</button>
        <p id="formMsg" class="d-none mt-2"></p>
      </div>

      <p class="fw-semibold text-note">
       You have an account? <a href="index.html">Sign in </a>
      </p>
    </div>
  </div>
  </div>
  
  <script src="JS/bootstrap.bundle.min.js"></script>
  <script src="JS/main.js"></script>
</body>
</html>
